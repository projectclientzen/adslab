# ─── ADS LAB — Netlify Config ─────────────────────────────────────────────────
# FE: Next.js static export (ads-lab-fe/out/)
# Functions: ads-lab-fe/netlify/functions/

[build]
  base    = "ads-lab-fe"
  command = "npm install && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[functions."meta-fetch-scheduled"]
  schedule = "0 */4 * * *"

# SPA fallback — semua route ke index.html, React Router handle client-side
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
