# ─── ADS LAB — Netlify Config ─────────────────────────────────────────────────
# Base = ads-lab-fe (Next.js dashboard FE)
# Functions = ads-lab-fe/netlify/functions/ (FE + BE functions together)

[build]
  base    = "ads-lab-fe"
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory        = "netlify/functions"
  node_bundler     = "esbuild"

# Meta API scheduled fetch — every 4 hours
[functions."meta-fetch-scheduled"]
  schedule = "0 */4 * * *"
