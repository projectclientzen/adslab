[build]
  command = "npm install && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[functions."meta-fetch-scheduled"]
  schedule = "0 */4 * * *"
