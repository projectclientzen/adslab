[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Schedule Meta fetch every 4 hours
[[edge_functions]]
  path = "/.netlify/functions/generate-copy"
  function = "generate-copy"
